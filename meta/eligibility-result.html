    <footer class="footer">
        <div class="container">
            <p style="margin:0;">&copy; <span id="currentYear"></span> ColombianPassport.com. All Rights Reserved. &middot; <a href="https://www.colombianpassport.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a> &middot; <a href="https://www.colombianpassport.com/terms-and-conditions" target="_blank" rel="noopener">Terms and Conditions</a></p>
        </div>

    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        (function () {
            var params = new URLSearchParams(window.location.search);
            var status = (params.get('status') || '').toLowerCase().trim();

            // Aliases por compatibilidad: qualified / eligible / review / more-info / not-qualified
            if (status === 'eligible') status = 'qualified';
            if (status === 'more_info_needed' || status === 'more-info-needed' || status === 'review') status = 'more-info';
            if (status === 'not_qualified' || status === 'notqualified') status = 'not-qualified';

            var stored = null;
            try {
                stored = JSON.parse(sessionStorage.getItem('spouseVisaResult') || 'null');
            } catch (e) { stored = null; }

            // Si la URL no trae status pero hay dato guardado, usarlo
            if (!status && stored && stored.status) status = stored.status;

            var messages = (stored && stored.messages) || [];

            // WhatsApp CTA con el resultado del formulario (como pensionado/nómada):
            // envíanos por WhatsApp el resultado para ayudarte con una propuesta.
            var waText = 'Hello Camila, I just completed the Marriage/Spouse Visa eligibility check (' + (status || 'no status') + ').\n\n'
                + (messages.length ? messages.join('\n') : 'No additional notes.')
                + ((stored && stored.applicationCountry) ? '\nApplying from: ' + stored.applicationCountry : '') + '\n(via Meta)';
            var waLink = 'https://wa.me/573223395612?text=' + encodeURIComponent(waText);

            var card = document.getElementById('resultCard');
            var content = '';
            var pageTitle = '';

            if (status === 'qualified') {
                card.className = 'result-card result-qualified';
                pageTitle = 'You meet the basic requirements | Marriage Visa Colombia';
                content = ''
                    + '<div style="text-align:center;">' + "<svg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"margin-bottom:1rem;\"><circle cx=\"12\" cy=\"12\" r=\"10\" stroke=\"#22C55E\" stroke-width=\"2\"/><path d=\"M8 12.5l2.5 2.5L16 9.5\" stroke=\"#22C55E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>" + '</div>'
                    + '<h1>Great News! You May Qualify for a Colombian Spouse Visa!</h1>'
                    + '<p>Based on your answers, you appear to meet the basic eligibility requirements.</p>'
                    + '<p>Our immigration team can help you understand the next steps, required documents, and how to move forward with your application.</p>'
                    + '<div style="margin-top:1.5rem;"><a href="' + waLink + '" target="_blank" class="btn btn-green" style="background-color:#22C55E;">' + "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"vertical-align:-3px;margin-right:8px;\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>" + 'Get My Next Steps on WhatsApp</a></div>'
                    + "<p style=\"font-size:0.95rem;color:#6B7280;\">Speak with our team about your eligibility result. No obligation.</p>";
            } else if (status === 'more-info') {
                card.className = 'result-card result-more-info';
                pageTitle = 'Your case needs review | Marriage Visa Colombia';
                var items = messages.length
                    ? messages.map(function (m) { return '<li>' + m.replace(/</g, '&lt;') + '</li>'; }).join('')
                    : '<li>Your answers indicate points that need expert review before proceeding.</li>';
                content = ''
                    + '<h1>Thank You! Your Case Requires Special Attention.</h1>'
                    + '<p>Based on your answers, there are some points that need to be reviewed by an expert before proceeding:</p>'
                    + '<ul>' + items + '</ul>'
                    + '<p style="font-weight:600;">Send us your answers on WhatsApp and our team will tell you the best next steps for your situation.</p>'
                    + '<div style="margin-top:1.5rem;"><a href="' + waLink + '" target="_blank" class="btn btn-green" style="background-color:#22C55E;">' + "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"vertical-align:-3px;margin-right:8px;\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>" + 'Send My Answers on WhatsApp</a></div>'
                    + "<p style=\"font-size:0.95rem;color:#6B7280;\">Speak with our team about your eligibility result. No obligation.</p>";
            } else if (status === 'not-qualified') {
                card.className = 'result-card result-not-qualified';
                pageTitle = 'Important information about your case | Marriage Visa Colombia';
                var itemsNQ = messages.length
                    ? messages.map(function (m) { return '<li>' + m.replace(/</g, '&lt;') + '</li>'; }).join('')
                    : '<li>Your answers do not meet the fundamental requirements for the Spouse Visa.</li>';
                content = ''
                    + '<h1>Important Information About Your Case</h1>'
                    + '<p>Thank you for your answers. Based on the information provided, we have identified some points that do not meet the fundamental requirements for the Spouse Visa:</p>'
                    + '<ul>' + itemsNQ + '</ul>'+ '<p>Your answers suggest this visa may not be the right fit right now — but other routes may exist. Chat with us and we will point you in the right direction.</p>'
                    + '<div style="margin-top:1.5rem;"><a href="' + waLink + '" target="_blank" class="btn btn-green" style="background-color:#22C55E;">' + "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"vertical-align:-3px;margin-right:8px;\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>" + 'Chat With Us on WhatsApp</a></div>'
                    + "<p style=\"font-size:0.95rem;color:#6B7280;\">Speak with our team about your eligibility result. No obligation.</p>";
            } else {
                // Acceso directo sin completar el formulario
                card.className = 'result-card';
                pageTitle = 'Check your eligibility | Marriage Visa Colombia';
                content = ''
                    + '<h1>Please complete the eligibility check first</h1>'
                    + '<p>We couldn\u2019t find your answers. Please go back and answer the quick questions so we can show your personalized result.</p>'
                    + '<div style="margin-top:1.5rem;"><a href="/meta/#form-section" class="btn btn-green" style="background-color:#2563EB;">Go to Eligibility Form</a></div>';
            }

            card.innerHTML = content;
            if (pageTitle) document.title = pageTitle;

            // El enlace para volver al test solo se muestra si no hay respuestas guardadas.
            var backLinkWrapper = document.getElementById('backLinkWrapper');
            if (backLinkWrapper) {
                backLinkWrapper.style.display = (status === 'qualified' || status === 'more-info' || status === 'not-qualified') ? 'none' : 'block';
            }

            // Evento dataLayer para GTM: permite crear el activador personalizado
            // "eligibility_result_view" ADEMÁS del Page View de esta URL.
            window.dataLayer = window.dataLayer || [];
            if (status === 'qualified' || status === 'more-info' || status === 'not-qualified') {
                window.dataLayer.push({
                    event: 'eligibility_result_view',
                    eligibility_status: status
                });
            }
        })();
    </script>
